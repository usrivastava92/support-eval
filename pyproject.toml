[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-eval"
version = "0.1.0"
description = "Replayable offline evaluation pipeline for support responses"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "openai>=1.40,<2",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0,<9",
]

[project.scripts]
support-eval = "support_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
